<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#13212b" />
    <title>Elle Jew Admin sem conexão</title>
    <style>
      :root { color-scheme: light; font-family: Georgia, serif; background: #13212b; color: #f5f1e8; }
      body { min-height: 100svh; margin: 0; padding: max(28px, env(safe-area-inset-top)) 24px max(28px, env(safe-area-inset-bottom)); display: grid; place-items: center; box-sizing: border-box; }
      main { width: min(440px, 100%); padding: 42px 30px; border: 1px solid rgba(207, 167, 80, .55); background: linear-gradient(145deg, rgba(255,255,255,.07), transparent); }
      span { color: #cfa750; font: 700 11px/1.2 Arial, sans-serif; letter-spacing: .18em; text-transform: uppercase; }
      h1 { margin: 18px 0 12px; font-size: clamp(42px, 12vw, 64px); font-weight: 400; line-height: .95; }
      p { margin: 0 0 26px; color: rgba(245,241,232,.76); font: 16px/1.6 Arial, sans-serif; }
      button { width: 100%; min-height: 52px; color: #13212b; border: 0; background: #cfa750; font: 700 12px Arial, sans-serif; letter-spacing: .1em; text-transform: uppercase; }
    </style>
  </head>
  <body>
    <main>
      <span>Elle Jew Admin</span>
      <h1>Sem conexão agora.</h1>
      <p>Conecte o iPhone à internet e tente novamente. Seus dados administrativos não são guardados no cache do aparelho.</p>
      <button type="button" onclick="location.reload()">Tentar novamente</button>
    </main>
  </body>
</html>
